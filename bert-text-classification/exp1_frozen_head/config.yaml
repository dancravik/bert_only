# EXP 1 — baseline, frozen backbone: cut off BERT's pretraining head,
# attach a fresh classification head, train ONLY the head (backbone frozen).
comet:
  api_key: "sqAgtJu3JqBTsHLGMTekvp9GH"          # вставь свой ключ с comet.com/account-settings
  workspace: "danchenko-rtm"       # имя воркспейса в comet
  project_name: "bert-text-classification"
  tags: ["exp1", "frozen_head", "bert-base-uncased"]

data:
  train_csv: "/kaggle/input/datasets/datatattle/covid-19-nlp-text-classification/Corona_NLP_train.csv"
  test_csv: "/kaggle/input/datasets/datatattle/covid-19-nlp-text-classification/Corona_NLP_test.csv"
  val_size: 0.1
  max_length: 128

model:
  name: "bert-base-uncased"
  num_labels: 5
  freeze_backbone: true

train:
  seed: 42
  weight_decay: 0.01
  warmup_ratio: 0.06
  num_workers: 2

# --- step 1: run `python train.py --config config.yaml --mode search` ---
# Grid search over (lr, bs). NOTE: a linear probe over a frozen backbone
# starts from RANDOM head weights and needs several epochs to warm up — the
# previous 2-epoch protocol undertrained every trial (~0.29 F1 best). 4 epochs
# per trial and an lr grid covering the 1e-3..1e-2 range linear probes need.
search:
  search_epochs: 4
  learning_rates: [1.0e-2, 5.0e-3, 1.0e-3, 5.0e-4]
  batch_sizes: [16, 32]

# --- step 2: fill in the winner from the search, then run
# `python train.py --config config.yaml --mode final` for the full run ---
final:
  learning_rate: 1.0e-3          # provisional placeholder — fill the search winner
  batch_size: 32
  epochs: 15

error_analysis:
  top_k: 25

output_dir: "./outputs/exp1_frozen_head"
